<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donde la Gaby - Datos de Transferencia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo estilo textura de madera rústica de carrito / food truck nocturno */
            background-color: #120a07;
            background-image: 
                radial-gradient(circle, #2d1810 10%, transparent 11%),
                radial-gradient(circle, #1a0e0a 10%, transparent 11%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* MARQUESINA / CARTEL DE FOOD TRUCK */
        .foodtruck-awning {
            background: linear-gradient(135deg, #d90429 0%, #a5011b 100%);
            border: 4px solid #ffcc00;
            border-radius: 12px;
            padding: 12px 35px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(217, 4, 4, 0.5), inset 0 2px 5px rgba(255,255,255,0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            transform: rotate(-1deg);
        }

        .foodtruck-titulo {
            color: #ffcc00;
            font-size: 30px;
            font-weight: 950;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* CONTENEDOR PRINCIPAL ESTILO COMANDA / CARTEL */
        .ramada-container {
            max-width: 420px;
            width: 100%;
            background: #fffdf5;
            padding: 28px 22px 22px 22px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            border: 6px solid #ffcc00;
            position: relative;
            z-index: 10;
        }

        /* TARJETAS DE DATOS ESTILO TICKET DE PEDIDO */
        .card {
            background: #ffffff;
            border: 2px dashed #e6d2b5;
            border-left: 6px solid #d90429;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: #ffcc00;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .label {
            font-weight: 800;
            color: #d90429;
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .valor {
            color: #1a0b01;
            font-size: 16px;
            font-weight: 700;
        }

        /* BOTÓN ESTILO BOTÓN DE LLAMADO A ACCIÓN DE LOCAL DE COMIDA */
        button {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9e00 100%);
            color: #120a07;
            border: 3px solid #d90429;
            padding: 15px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(255, 204, 0, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: linear-gradient(135deg, #ffdb4d 0%, #ffcc00 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 22px rgba(255, 204, 0, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* AVISO FLOTANTE CON DISEÑO DE COMPLETO / CARTEL */
        #mensaje-flotante {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #d90429 0%, #900020 100%);
            border: 5px solid #ffcc00;
            color: #ffffff;
            padding: 30px 45px;
            border-radius: 50px; /* Forma de pan de completo */
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            z-index: 1000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: aparecer 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.6); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .pie-foodtruck {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #e6b800;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="foodtruck-awning">
        <div class="foodtruck-titulo">Donde la Gaby</div>
    </div>

    <div class="ramada-container">
        <div class="card">
            <span class="label">Titular</span>
            <div class="valor">Gabriela Yévenes</div>
        </div>
        <div class="card">
            <span class="label">RUT</span>
            <div class="valor">16.873.861-7</div>
        </div>
        <div class="card">
            <span class="label">Banco</span>
            <div class="valor">Mercado Pago</div>
        </div>
        <div class="card">
            <span class="label">Tipo de Cuenta</span>
            <div class="valor">Cuenta Vista</div>
        </div>
        <div class="card">
            <span class="label">Nro de Cuenta</span>
            <div class="valor">1086877388</div>
        </div>
        <div class="card">
            <span class="label">Correo</span>
            <div class="valor">gabyfoodtrook@gmail.com</div>
        </div>

        <button onclick="copiarDatos()">
            Copiar Datos ⚡
        </button>
        
        <div class="pie-foodtruck">✨ ¡Los mejores bajones! ✨</div>
    </div>

    <!-- TARJETA FLOTANTE CON DISEÑO INTEGRAL DE COMPLETO -->
    <div id="mensaje-flotante">
        🌭 ¡Datos copiados correctamente! 🌭
    </div>

    <script src="script.js"></script>
</body>
</html>
