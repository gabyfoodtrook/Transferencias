<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Donde la Gaby - Datos de Transferencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kalam:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #140b06;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,158,0,0.10) 0%, transparent 8%),
                radial-gradient(circle at 80% 10%, rgba(217,4,41,0.10) 0%, transparent 10%),
                radial-gradient(circle at 60% 70%, rgba(255,204,0,0.08) 0%, transparent 9%),
                radial-gradient(circle at 25% 85%, rgba(255,158,0,0.08) 0%, transparent 7%),
                repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: repeating-linear-gradient(-45deg, #ffcc00 0px, #ffcc00 16px, #1a1004 16px, #1a1004 32px);
            z-index: 5;
            opacity: 0.85;
        }

        .foodtruck-awning {
            background: #b5001f;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            padding: 10px 32px;
            margin-bottom: 15px;
            margin-top: 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.55);
            text-align: center;
            position: relative;
            z-index: 10;
            transform: rotate(-1.5deg);
        }

        .foodtruck-titulo {
            font-family: 'Bungee', 'Nunito', sans-serif;
            color: #ffcc00;
            font-size: 25px;
            letter-spacing: 0.5px;
            text-shadow: 3px 3px 0px #6e0012;
        }

        .foodtruck-subtitulo {
            font-family: 'Kalam', cursive;
            color: #ffe9a8;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0px;
            transform: rotate(0.5deg);
            text-shadow: 1px 1px 0px #6e0012;
        }

        .vapor-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: -6px;
        }

        .vapor {
            position: absolute;
            top: -14px;
            left: 50%;
            width: 3px;
            height: 14px;
            background: rgba(255,255,255,0.55);
            border-radius: 3px;
            animation: subir 2.2s ease-in-out infinite;
            filter: blur(1px);
        }

        .vapor:nth-child(2) { left: 42%; animation-delay: 0.4s; }
        .vapor:nth-child(3) { left: 58%; animation-delay: 0.8s; }

        @keyframes subir {
            0%   { transform: translateY(0) scaleX(1); opacity: 0; }
            25%  { opacity: 0.7; }
            100% { transform: translateY(-22px) scaleX(1.6); opacity: 0; }
        }

        .ramada-container {
            max-width: 400px;
            width: 100%;
            background:
                repeating-linear-gradient(100deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px),
                linear-gradient(160deg, #2b2118 0%, #1c150f 100%);
            padding: 12px 20px 20px 20px;
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,204,0,0.12);
            border: 4px solid #ffcc00;
            position: relative;
            z-index: 10;
        }

        .card {
            background: #fffdf7;
            border: 1px dashed #cbb488;
            border-left: 5px solid #b5001f;
            padding: 6px 13px;
            margin-bottom: 6px;
            border-radius: 6px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateX(2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .label {
            font-family: 'Kalam', cursive;
            font-weight: 700;
            color: #b5001f;
            display: block;
            font-size: 15px;
            margin-bottom: 1px;
        }

        .valor {
            color: #1a0b01;
            font-size: 15px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
        }

        .no-tel {
            unicode-bidi: embed;
        }

        button {
            background: #ffcc00;
            color: #1a0b01;
            border: 3px solid #1a0b01;
            padding: 12px;
            font-family: 'Bungee', 'Nunito', sans-serif;
            font-size: 15px;
            letter-spacing: 0.5px;
            font-weight: 400;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            box-shadow: 4px 4px 0px #1a0b01;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1a0b01;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1a0b01;
        }

        #overlay-blur {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 2, 0.75);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        #mensaje-flotante {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 90%;
            max-width: 380px;
            text-align: center;
            animation: explotarMaximo 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.75) forwards;
        }

        .flotante-animacion {
            animation: flotar 2.5s ease-in-out infinite;
            display: inline-block;
        }

        .flotante-wrapper {
            position: relative;
            display: inline-block;
            text-align: center;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .completo-flotante-img {
            width: 230px;
            max-width: 70vw;
            height: auto;
            display: block;
            margin: 45px auto 0 auto;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));
        }

        .bocadillo {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #fffdf7;
            color: #1a0b01;
            padding: 12px 20px;
            border-radius: 50px;
            border: 3px solid #1a0b01;
            font-family: 'Nunito', sans-serif;
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 3px 3px 0px #1a0b01;
            z-index: 10;
        }

        .bocadillo::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #fffdf7;
            border: 3px solid #1a0b01;
            border-radius: 50%;
        }

        .bocadillo::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 7px;
            background: #fffdf7;
            border: 2px solid #1a0b01;
            border-radius: 50%;
        }

        .bocadillo .mini-burbuja-1 {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 48%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #fffdf7;
            border: 2px solid #1a0b01;
            border-radius: 50%;
        }

        .bocadillo .mini-burbuja-2 {
            content: '';
            position: absolute;
            bottom: -27px;
            left: 46%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background: #fffdf7;
            border: 1.5px solid #1a0b01;
            border-radius: 50%;
        }

        @keyframes explotarMaximo {
            0% { 
                opacity: 0; 
                transform: translate(-50%, -50%) scale(0.01); 
            }
            45% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1.6); 
            }
            70% { 
                transform: translate(-50%, -50%) scale(0.75); 
            }
            85% { 
                transform: translate(-50%, -50%) scale(1.15); 
            }
            100% { 
                opacity: 1; 
                transform: translate(-50%, -50%) scale(1); 
            }
        }

        .pie-foodtruck {
            text-align: center;
            margin-top: 4px;
            font-family: 'Kalam', cursive;
            /* Reducido 4 píxeles: pasó de 26px a 22px */
            font-size: 22px;
            font-weight: 700;
            color: #ffcc00;
            text-shadow: 2px 2px 0px #6e0012;
            transform: rotate(-0.5deg);
        }
    </style>
</head>
<body>

    <div id="overlay-blur"></div>

    <div class="foodtruck-awning">
        <span class="vapor-wrap">
            <span class="vapor"></span><span class="vapor"></span><span class="vapor"></span>
        </span>
        <div class="foodtruck-titulo">Donde la Gaby</div>
        <div class="foodtruck-subtitulo">datos pa' la transfe 💸</div>
    </div>

    <div class="ramada-container">
        <div class="card">
            <span class="label">Titular</span>
            <div class="valor">Gabriela Yévenes</div>
        </div>
        <div class="card">
            <span class="label">RUT</span>
            <div class="valor">16.873.861-7</div>
        </div>
        <div class="card">
            <span class="label">Banco</span>
            <div class="valor">Mercado Pago</div>
        </div>
        <div class="card">
            <span class="label">Tipo de Cuenta</span>
            <div class="valor">Cuenta Vista</div>
        </div>
        <div class="card">
            <span class="label">Nro de Cuenta</span>
            <div class="valor" x-ms-format-detection="none"><span style="display:none;">-</span><span class="no-tel">1086877388</span></div>
        </div>
        <div class="card">
            <span class="label">Correo</span>
            <div class="valor">gabyfoodtrook@gmail.com</div>
        </div>

        <button onclick="copiarDatos()">
            Copiar y al bajón 🌭
        </button>

        <div class="pie-foodtruck">✨ ¡los mejores bajones! ✨</div>
    </div>

    <div id="mensaje-flotante">
        <div class="flotante-animacion">
            <div class="flotante-wrapper">
                <div class="bocadillo">
                    ¡Datos copiados exitosamente!
                    <span class="mini-burbuja-1"></span>
                    <span class="mini-burbuja-2"></span>
                </div>
                <img src="hotdog.png" alt="Completo con lentes" class="completo-flotante-img">
            </div>
        </div>
    </div>

    <script>
        function copiarDatos() {
            const tarjetas = document.querySelectorAll('.valor');
            if (tarjetas.length === 0) return;
            const titular = tarjetas[0].innerText.trim();
            const rut = tarjetas[1].innerText.trim();
            const banco = tarjetas[2].innerText.trim();
            const tipoCuenta = tarjetas[3].innerText.trim();
            const nroCuenta = tarjetas[4].innerText.replace(/-/g, '').trim();
            const correo = tarjetas[5].innerText.trim();
            const textoACopiar = 
                titular + '\n' +
                rut + '\n' +
                banco + '\n' +
                tipoCuenta + '\n' +
                nroCuenta + '\n' +
                correo;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textoACopiar).then(() => {
                    mostrarMensaje();
                }).catch(err => {
                    fallbackCopiarTexto(textoACopiar);
                });
            } else {
                fallbackCopiarTexto(textoACopiar);
            }
        }

        function fallbackCopiarTexto(texto) {
            const textarea = document.createElement('textarea');
            textarea.value = texto;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const success = document.execCommand('copy');
                if (success) {
                    mostrarMensaje();
                }
            } catch (err) {
                console.error('Error al copiar', err);
            }
            document.body.removeChild(textarea);
        }

        function mostrarMensaje() {
            const overlay = document.getElementById('overlay-blur');
            const mensaje = document.getElementById('mensaje-flotante');
            if (!overlay || !mensaje) return;
            
            overlay.style.display = 'block';
            mensaje.style.display = 'block';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                mensaje.style.display = 'none';
            }, 2500);
        }
    </script>
</body>
</html>
