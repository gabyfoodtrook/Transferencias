<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donde la Gaby - Datos de Transferencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kalam:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #140b06;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(255,158,0,0.10) 0%, transparent 8%),
                radial-gradient(circle at 80% 10%, rgba(217,4,41,0.10) 0%, transparent 10%),
                radial-gradient(circle at 60% 70%, rgba(255,204,0,0.08) 0%, transparent 9%),
                radial-gradient(circle at 25% 85%, rgba(255,158,0,0.08) 0%, transparent 7%),
                repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: repeating-linear-gradient(-45deg, #ffcc00 0px, #ffcc00 16px, #1a1004 16px, #1a1004 32px);
            z-index: 5;
            opacity: 0.85;
        }

        .foodtruck-awning {
            background: #b5001f;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            padding: 10px 32px;
            margin-bottom: 22px;
            margin-top: 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.55);
            text-align: center;
            position: relative;
            z-index: 10;
            transform: rotate(-1.5deg);
        }

        .foodtruck-titulo {
            font-family: 'Bungee', 'Nunito', sans-serif;
            color: #ffcc00;
            font-size: 27px;
            letter-spacing: 0.5px;
            text-shadow: 3px 3px 0px #6e0012;
        }

        .foodtruck-subtitulo {
            font-family: 'Kalam', cursive;
            color: #ffe9a8;
            font-size: 13px;
            margin-top: 2px;
            transform: rotate(0.5deg);
        }

        .vapor-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: -6px;
        }

        .vapor {
            position: absolute;
            top: -14px;
            left: 50%;
            width: 3px;
            height: 14px;
            background: rgba(255,255,255,0.55);
            border-radius: 3px;
            animation: subir 2.2s ease-in-out infinite;
            filter: blur(1px);
        }

        .vapor:nth-child(2) { left: 42%; animation-delay: 0.4s; }
        .vapor:nth-child(3) { left: 58%; animation-delay: 0.8s; }

        @keyframes subir {
            0%   { transform: translateY(0) scaleX(1); opacity: 0; }
            25%  { opacity: 0.7; }
            100% { transform: translateY(-22px) scaleX(1.6); opacity: 0; }
        }

        /* CONTENEDOR PRINCIPAL: CHAPA METALICA OSCURA, VENTANILLA DEL CARRO DE NOCHE */
        .ramada-container {
            max-width: 400px;
            width: 100%;
            background:
                repeating-linear-gradient(100deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px),
                linear-gradient(160deg, #2b2118 0%, #1c150f 100%);
            padding: 26px 20px 20px 20px;
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,204,0,0.12);
            border: 4px solid #ffcc00;
            position: relative;
            z-index: 10;
        }

        /* TARJETAS DE DATOS: ILUMINADAS COMO SI SE VIERAN DESDE FUERA DEL CARRO */
        .card {
            background: #fffdf7;
            border: 1px dashed #cbb488;
            border-left: 5px solid #b5001f;
            padding: 8px 13px;
            margin-bottom: 8px;
            border-radius: 6px;
            text-align: left;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateX(2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .label {
            font-family: 'Kalam', cursive;
            font-weight: 700;
            color: #b5001f;
            display: block;
            font-size: 14px;
            margin-bottom: 1px;
        }

        .valor {
            color: #1a0b01;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
        }

        button {
            background: #ffcc00;
            color: #1a0b01;
            border: 3px solid #1a0b01;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 17px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 4px 4px 0px #1a0b01;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1a0b01;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1a0b01;
        }

        #mensaje-flotante {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            animation: aparecer 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }

        .completo-flotante {
            display: block;
            width: 320px;
            max-width: 85vw;
            height: auto;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.85));
        }

        .completo-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-size: 19px;
            font-weight: 900;
            color: #fffdf7;
            text-shadow: 2px 2px 0 #5a1400, -1px -1px 0 #5a1400, 1px -1px 0 #5a1400, -1px 1px 0 #5a1400;
            line-height: 1.25;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.6); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .pie-foodtruck {
            text-align: center;
            margin-top: 14px;
            font-family: 'Kalam', cursive;
            font-size: 15px;
            color: #8a6a2b;
            transform: rotate(-0.5deg);
        }
    </style>
</head>
<body>
        <div class="foodtruck-titulo">Donde la Gaby</div>
        <div class="foodtruck-subtitulo">🚚 datos pa' la transfe 🚚</div>
    </div>

    <div class="ramada-container">
        <div class="card">
            <span class="label">Titular</span>
            <div class="valor">Gabriela Yévenes</div>
        </div>
        <div class="card">
            <span class="label">RUT</span>
            <div class="valor">16.873.861-7</div>
        </div>
        <div class="card">
            <span class="label">Banco</span>
            <div class="valor">Mercado Pago</div>
        </div>
        <div class="card">
            <span class="label">Tipo de Cuenta</span>
            <div class="valor">Cuenta Vista</div>
        </div>
        <div class="card">
            <span class="label">Nro de Cuenta</span>
            <div class="valor">1086877388</div>
        </div>
        <div class="card">
            <span class="label">Correo</span>
            <div class="valor">gabyfoodtrook@gmail.com</div>
        </div>

        <button onclick="copiarDatos()">
            Copiar y al bajón 🌭
        </button>

        <div class="pie-foodtruck">✨ ¡los mejores bajones! ✨</div>
    </div>

    <!-- MENSAJE FLOTANTE: EL COMPLETO ES TODO EL MENSAJE, CON EL TEXTO ENCIMA -->
    <div id="mensaje-flotante">
        <svg class="completo-flotante" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="160" cy="150" rx="140" ry="12" fill="rgba(0,0,0,0.35)"/>
            <path d="M20 100 Q160 145 300 100 L296 128 Q160 165 24 128 Z" fill="#d98f3d"/>
            <rect x="34" y="82" width="252" height="34" rx="17" fill="#8f3820"/>
            <rect x="34" y="82" width="252" height="14" rx="7" fill="#a5432b"/>
            <path d="M40 78 Q100 58 160 78 Q100 70 40 78 Z" fill="#7a9a4a"/>
            <path d="M150 80 Q215 56 280 80 Q215 72 150 80 Z" fill="#c62b2b"/>
            <path d="M36 72 Q65 56 94 72 Q123 56 152 72 Q181 56 210 72 Q239 56 268 72 Q283 64 292 68"
                  stroke="#fdf6e8" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M16 55 Q160 -10 304 55 Q160 40 16 55 Z" fill="#f0b45c"/>
            <path d="M30 50 Q160 5 290 50" stroke="#d98f3d" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <div class="completo-texto">¡Datos copiados<br>exitosamente!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
