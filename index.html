<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Transferencia - Foodtruck de Completos y Sándwiches</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fondo estilo fuente de soda / noche de foodtruck cálido */
            background: radial-gradient(circle at 50% 30%, #3d1c02 0%, #1a0b01 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* TÍTULO/ENCABEZADO TEMÁTICO DE FOODTRUCK */
        .foodtruck-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .foodtruck-header h1 {
            color: #ffcc00;
            font-size: 26px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .foodtruck-header p {
            color: #ffffff;
            font-size: 14px;
            margin-top: 5px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* CAJA PRINCIPAL CON MARCO TRICOLOR */
        .ramada-container {
            max-width: 420px;
            width: 100%;
            background: #fffdf9;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-top: 6px solid #0039a6;
            border-left: 6px solid #0039a6;
            border-right: 6px solid #d52b1e;
            border-bottom: 6px solid #d52b1e;
            position: relative;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2d7c5;
            border-left: 4px solid #ff9900; /* Toque mustard/foodtruck */
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-align: left;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateX(3px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .label {
            font-weight: 700;
            color: #b30000; /* Tono rojo tipo ketchup */
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .valor {
            color: #222222;
            font-size: 16px;
            font-weight: 600;
        }

        button {
            background: linear-gradient(135deg, #ffcc00 0%, #e6b800 100%);
            color: #1a0b01;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 5px 12px rgba(255, 204, 0, 0.3);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: linear-gradient(135deg, #ffd633 0%, #ffcc00 100%);
            transform: translateY(-2px);
        }

        #mensaje-flotante {
            display: none;
            background-color: #1b7e36;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO TEMÁTICO DE COMPLETO Y SÁNDWICH -->
    <div class="foodtruck-header">
        <h1>🌭 Foodtruck & Sándwiches 🥪</h1>
        <p>¡Los mejores completos chilenos y churrascos!</p>
    </div>

    <div class="ramada-container">
        <div class="card">
            <span class="label">Titular</span>
            <div class="valor">Gabriela Yévenes</div>
        </div>
        <div class="card">
            <span class="label">RUT</span>
            <div class="valor">16.873.861-7</div>
        </div>
        <div class="card">
            <span class="label">Banco</span>
            <div class="valor">Mercado Pago</div>
        </div>
        <div class="card">
            <span class="label">Tipo de Cuenta</span>
            <div class="valor">Cuenta Vista</div>
        </div>
        <div class="card">
            <span class="label">Nro de Cuenta</span>
            <div class="valor">1086877388</div>
        </div>
        <div class="card">
            <span class="label">Correo</span>
            <div class="valor">gabyfoodtrook@gmail.com</div>
        </div>

        <button onclick="copiarDatos()">
            <span>Copiar Datos</span> 🌭🍅🥑
        </button>
        
        <div id="mensaje-flotante">¡Datos copiados! ¡A disfrutar tu completo! 🎉</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
